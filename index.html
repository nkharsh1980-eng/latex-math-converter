<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Math & Physics LaTeX Converter</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --danger: #ef4444;
      --success: #10b981;
      --canvas-bg: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    header {
      text-align: center;
      padding: 6px 0;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
    }

    header p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    .api-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .api-section label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .api-input-row {
      display: flex;
      gap: 8px;
    }

    input[type="password"],
    input[type="text"] {
      flex: 1;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--text);
      font-size: 0.85rem;
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
    }

    .canvas-container {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: var(--canvas-bg);
      border-radius: 10px;
      overflow: hidden;
      touch-action: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }

    /* Eraser indicator circle */
    .eraser-indicator {
      position: absolute;
      width: 24px;
      height: 24px;
      border: 2px dashed #ef4444;
      background: rgba(239, 68, 68, 0.15);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      display: none;
      z-index: 10;
    }

    /* Tool Selector Buttons */
    .tool-selector {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }

    .tool-btn {
      flex: 1;
      padding: 8px 4px;
      font-size: 0.78rem;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.15s ease;
    }

    .tool-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.35);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .btn {
      flex: 1;
      min-width: 65px;
      padding: 8px 10px;
      font-size: 0.82rem;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #334155;
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      flex: 2;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-danger {
      color: #fca5a5;
    }

    .btn-success {
      background: var(--success);
      border-color: var(--success);
    }

    .file-input {
      display: none;
    }

    .status-bar {
      font-size: 0.8rem;
      text-align: center;
      min-height: 1.2rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .output-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .output-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .preview-box {
      background: #ffffff;
      color: #0f172a;
      padding: 14px;
      border-radius: 8px;
      min-height: 70px;
      overflow-x: auto;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    textarea.latex-raw {
      width: 100%;
      height: 90px;
      background: #0f172a;
      border: 1px solid var(--border);
      color: #38bdf8;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
      border-radius: 8px;
      padding: 8px;
      resize: vertical;
      outline: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Math & Physics to LaTeX</h1>
      <p>Draw or upload equations to convert using Gemini</p>
    </header>

    <div class="card api-section">
      <label for="apiKey">Google AI Studio API Key</label>
      <div class="api-input-row">
        <input type="password" id="apiKey" placeholder="Paste your API key here..." autocomplete="off" />
        <button class="btn" id="saveKeyBtn">Save</button>
      </div>
    </div>

    <div class="card">
      <div class="canvas-container" id="canvasContainer">
        <canvas id="paintCanvas"></canvas>
        <div class="eraser-indicator" id="eraserIndicator"></div>
      </div>

      <!-- Tool Switcher -->
      <div class="tool-selector">
        <button class="tool-btn active" id="penTool" data-mode="pen">✏️ Pen</button>
        <button class="tool-btn" id="areaEraserTool" data-mode="area">🧹 Area Eraser</button>
        <button class="tool-btn" id="strokeEraserTool" data-mode="stroke">⚡ Stroke Eraser</button>
      </div>

      <!-- Action Buttons -->
      <div class="toolbar">
        <button class="btn btn-danger" id="clearBtn">Clear</button>
        <button class="btn" id="undoBtn">Undo</button>
        <label class="btn" for="cameraUpload">
          📷 Photo
          <input type="file" id="cameraUpload" class="file-input" accept="image/*" capture="environment" />
        </label>
        <label class="btn" for="fileUpload">
          📁 Upload
          <input type="file" id="fileUpload" class="file-input" accept="image/*" />
        </label>
      </div>

      <div class="toolbar" style="margin-top: 8px;">
        <button class="btn btn-primary" id="convertBtn">⚡ Convert to LaTeX</button>
      </div>

      <div class="status-bar" id="statusBar">Ready</div>
    </div>

    <div class="card output-section" id="outputCard">
      <div class="output-header">
        <span class="output-title">Rendered Preview</span>
        <button class="btn btn-success" id="copyBtn" style="padding: 4px 10px; font-size: 0.75rem;">Copy LaTeX</button>
      </div>

      <div class="preview-box" id="previewArea">
        <span style="color: #94a3b8; font-size: 0.9rem;">Equation preview will appear here</span>
      </div>

      <label class="output-title">Raw LaTeX Code</label>
      <textarea id="rawLatex" class="latex-raw" readonly placeholder="LaTeX output will appear here..."></textarea>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("paintCanvas");
    const ctx = canvas.getContext("2d");
    const eraserIndicator = document.getElementById("eraserIndicator");

    let currentMode = "pen"; // 'pen', 'area', or 'stroke'
    let isInteracting = false;
    let strokes = []; // Array of { points: [{x, y}], width: number, color: string }
    let currentStroke = null;
    let bgImage = null;
    let history = [];
    const maxHistory = 20;

    // Tool switching
    const toolButtons = document.querySelectorAll(".tool-btn");
    toolButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        toolButtons.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentMode = btn.dataset.mode;
        
        if (currentMode === "area") {
          document.getElementById("statusBar").textContent = "Area Eraser: Drag to erase hovered parts.";
        } else if (currentMode === "stroke") {
          document.getElementById("statusBar").textContent = "Stroke Eraser: Tap any line to erase the entire stroke.";
        } else {
          document.getElementById("statusBar").textContent = "Pen: Ready to draw.";
        }
      });
    });

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;

      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;

      redrawCanvas();
      if (history.length === 0) saveState();
    }

    function redrawCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;

      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.scale(dpr, dpr);

      // Render background photo if uploaded
      if (bgImage) {
        const hRatio = rect.width / bgImage.width;
        const vRatio = rect.height / bgImage.height;
        const ratio = Math.min(hRatio, vRatio);
        const shiftX = (rect.width - bgImage.width * ratio) / 2;
        const shiftY = (rect.height - bgImage.height * ratio) / 2;
        ctx.drawImage(bgImage, 0, 0, bgImage.width, bgImage.height, shiftX, shiftY, bgImage.width * ratio, bgImage.height * ratio);
      }

      // Render all vector strokes
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      for (const stroke of strokes) {
        const pts = stroke.points;
        if (!pts || pts.length === 0) continue;

        ctx.lineWidth = stroke.width || 3.5;
        ctx.strokeStyle = stroke.color || "#000000";
        ctx.fillStyle = stroke.color || "#000000";

        if (pts.length === 1) {
          ctx.beginPath();
          ctx.arc(pts[0].x, pts[0].y, (stroke.width || 3.5) / 2, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.moveTo(pts[0].x, pts[0].y);
          for (let i = 1; i < pts.length; i++) {
            ctx.lineTo(pts[i].x, pts[i].y);
          }
          ctx.stroke();
        }
      }

      ctx.restore();
    }

    function saveState() {
      if (history.length >= maxHistory) history.shift();
      history.push({
        strokes: JSON.parse(JSON.stringify(strokes)),
        bg: bgImage ? bgImage.src : null,
      });
    }

    function undo() {
      if (history.length > 1) {
        history.pop();
        const prevState = history[history.length - 1];
        strokes = JSON.parse(JSON.stringify(prevState.strokes));
        if (prevState.bg) {
          const img = new Image();
          img.onload = () => {
            bgImage = img;
            redrawCanvas();
          };
          img.src = prevState.bg;
        } else {
          bgImage = null;
          redrawCanvas();
        }
        document.getElementById("statusBar").textContent = "Undo applied.";
      } else {
        clearCanvas();
      }
    }

    function clearCanvas() {
      strokes = [];
      bgImage = null;
      redrawCanvas();
      history = [{ strokes: [], bg: null }];
      document.getElementById("statusBar").textContent = "Canvas cleared.";
    }

    function getCoordinates(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top,
      };
    }

    // Math helper: distance from point P to line segment AB squared
    function distToSegmentSq(p, a, b) {
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      if (dx === 0 && dy === 0) {
        return (p.x - a.x) ** 2 + (p.y - a.y) ** 2;
      }
      const t = Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / (dx * dx + dy * dy)));
      const cx = a.x + t * dx;
      const cy = a.y + t * dy;
      return (p.x - cx) ** 2 + (p.y - cy) ** 2;
    }

    // Mode 2: Stroke Eraser (Deletes entire continuous stroke on touch)
    function applyStrokeEraser(x, y) {
      const thresholdSq = 14 * 14;
      const p = { x, y };
      let changed = false;

      strokes = strokes.filter((stroke) => {
        const pts = stroke.points;
        if (!pts || pts.length === 0) return false;

        let hit = false;
        if (pts.length === 1) {
          hit = (pts[0].x - p.x) ** 2 + (pts[0].y - p.y) ** 2 <= thresholdSq;
        } else {
          for (let i = 0; i < pts.length - 1; i++) {
            if (distToSegmentSq(p, pts[i], pts[i + 1]) <= thresholdSq) {
              hit = true;
              break;
            }
          }
        }

        if (hit) {
          changed = true;
          return false; // remove this stroke
        }
        return true;
      });

      if (changed) redrawCanvas();
      return changed;
    }

    // Mode 1: Area Eraser (Erases only where hovered/touched by splitting strokes)
    function applyAreaEraser(ex, ey, radius = 12) {
      const rSq = radius * radius;
      const newStrokes = [];
      let changed = false;

      for (const stroke of strokes) {
        const pts = stroke.points;
        if (!pts || pts.length === 0) continue;

        if (pts.length === 1) {
          const dSq = (pts[0].x - ex) ** 2 + (pts[0].y - ey) ** 2;
          if (dSq > rSq) {
            newStrokes.append ? newStrokes.append(stroke) : newStrokes.push(stroke);
          } else {
            changed = true;
          }
          continue;
        }

        // Interpolate points along the stroke to ensure no segment skips
        const dense = [];
        for (let i = 0; i < pts.length; i++) {
          if (i === 0) {
            dense.push(pts[0]);
          } else {
            const p1 = dense[dense.length - 1];
            const p2 = pts[i];
            const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
            const step = 3.0;
            if (dist > step) {
              const count = Math.floor(dist / step);
              for (let k = 1; k <= count; k++) {
                const t = k / (count + 1);
                dense.push({ x: p1.x + t * (p2.x - p1.x), y: p1.y + t * (p2.y - p1.y) });
              }
            }
            dense.push(p2);
          }
        }

        // Split stroke into sub-segments that fall outside the eraser circle
        let currentSeg = [];
        let modified = false;

        for (const p of dense) {
          const dSq = (p.x - ex) ** 2 + (p.y - ey) ** 2;
          if (dSq > rSq) {
            currentSeg.push(p);
          } else {
            modified = true;
            if (currentSeg.length >= 2) {
              newStrokes.push({ points: currentSeg, width: stroke.width, color: stroke.color });
            }
            currentSeg = [];
          }
        }

        if (currentSeg.length >= 2) {
          newStrokes.push({ points: currentSeg, width: stroke.width, color: stroke.color });
        }

        if (modified) changed = true;
      }

      if (changed) {
        strokes = newStrokes;
        redrawCanvas();
      }
      return changed;
    }

    // Touch & Mouse Handling
    function handleStart(e) {
      isInteracting = true;
      const { x, y } = getCoordinates(e);

      if (currentMode === "pen") {
        currentStroke = { points: [{ x, y }], width: 3.5, color: "#000000" };
        strokes.push(currentStroke);
        redrawCanvas();
      } else if (currentMode === "stroke") {
        applyStrokeEraser(x, y);
      } else if (currentMode === "area") {
        applyAreaEraser(x, y);
        showEraserIndicator(x, y);
      }
    }

    function handleMove(e) {
      if (!isInteracting && currentMode !== "area") return;
      e.preventDefault();
      const { x, y } = getCoordinates(e);

      if (currentMode === "pen" && isInteracting) {
        currentStroke.points.push({ x, y });
        redrawCanvas();
      } else if (currentMode === "stroke" && isInteracting) {
        applyStrokeEraser(x, y);
      } else if (currentMode === "area") {
        showEraserIndicator(x, y);
        if (isInteracting) {
          applyAreaEraser(x, y);
        }
      }
    }

    function handleEnd() {
      if (isInteracting) {
        isInteracting = false;
        currentStroke = null;
        saveState();
      }
      eraserIndicator.style.display = "none";
    }

    function showEraserIndicator(x, y) {
      eraserIndicator.style.left = `${x}px`;
      eraserIndicator.style.top = `${y}px`;
      eraserIndicator.style.display = "block";
    }

    canvas.addEventListener("touchstart", handleStart, { passive: false });
    canvas.addEventListener("touchmove", handleMove, { passive: false });
    canvas.addEventListener("touchend", handleEnd);
    canvas.addEventListener("mousedown", handleStart);
    canvas.addEventListener("mousemove", handleMove);
    canvas.addEventListener("mouseup", handleEnd);
    canvas.addEventListener("mouseleave", handleEnd);

    document.getElementById("clearBtn").addEventListener("click", clearCanvas);
    document.getElementById("undoBtn").addEventListener("click", undo);

    function handleImageFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          bgImage = img;
          strokes = [];
          redrawCanvas();
          saveState();
          document.getElementById("statusBar").textContent = "Image loaded on canvas.";
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    document.getElementById("cameraUpload").addEventListener("change", (e) => {
      handleImageFile(e.target.files[0]);
    });
    document.getElementById("fileUpload").addEventListener("change", (e) => {
      handleImageFile(e.target.files[0]);
    });

    const apiKeyInput = document.getElementById("apiKey");
    const savedKey = localStorage.getItem("gemini_api_key");
    if (savedKey) apiKeyInput.value = savedKey;

    document.getElementById("saveKeyBtn").addEventListener("click", () => {
      const key = apiKeyInput.value.trim();
      if (key) {
        localStorage.setItem("gemini_api_key", key);
        document.getElementById("statusBar").textContent = "API key saved locally.";
      } else {
        localStorage.removeItem("gemini_api_key");
        document.getElementById("statusBar").textContent = "API key removed.";
      }
    });

    function renderLatex(latexString) {
      const previewArea = document.getElementById("previewArea");
      const rawTextarea = document.getElementById("rawLatex");
      rawTextarea.value = latexString;

      let cleanMath = latexString.trim();
      cleanMath = cleanMath.replace(/^\\\[/, "").replace(/\\\]$/, "");
      cleanMath = cleanMath.replace(/^\$\$/, "").replace(/\$\$$/, "");
      cleanMath = cleanMath.replace(/^\\begin{equation\*?}/, "").replace(/\\end{equation\*?}$/, "");

      try {
        katex.render(cleanMath, previewArea, {
          displayMode: true,
          throwOnError: false,
        });
      } catch (err) {
        previewArea.textContent = latexString;
      }
    }

    async function convertToLatex() {
      const apiKey = apiKeyInput.value.trim() || localStorage.getItem("gemini_api_key");
      const statusBar = document.getElementById("statusBar");
      const convertBtn = document.getElementById("convertBtn");

      if (!apiKey) {
        statusBar.textContent = "Please provide a Google AI Studio API key.";
        apiKeyInput.focus();
        return;
      }

      convertBtn.disabled = true;
      statusBar.textContent = "Transcribing with Gemini 3.8 Flash...";

      const base64Data = canvas.toDataURL("image/png").replace(/^data:image\/png;base64,/, "");

      const promptText = 
        "You are an expert LaTeX transcription system specializing in advanced mathematics, physics, and chemistry.\n" +
        "Task: Transcribe all handwritten or printed mathematical and physical formulas from the provided image into clean, standard LaTeX code.\n" +
        "Rules:\n" +
        "1. Output ONLY the LaTeX code. Do NOT wrap in markdown code fences (no ```latex or ```).\n" +
        "2. Do NOT add conversational replies, commentary, or greetings.\n" +
        "3. Use standard packages such as amsmath, amssymb, and physics.\n" +
        "4. For multi-line equations or derivations, use the \\begin{align*} ... \\end{align*} environment.\n" +
        "5. For single formulas, write the raw math expression or standard equation format without excess whitespace.";

      const payload = {
        contents: [
          {
            role: "user",
            parts: [
              { text: promptText },
              {
                inline_data: {
                  mime_type: "image/png",
                  data: base64Data,
                },
              },
            ],
          },
        ],
        generationConfig: {
          temperature: 0.1,
        },
      };

      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`;

      try {
        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          const errMsg = errData.error?.message || `HTTP ${response.status}`;

          if (response.status === 429 || errMsg.includes("Quota exceeded")) {
            const match = errMsg.match(/retry in ([0-9.]+)s/i);
            let waitSeconds = match && match ? Math.ceil(parseFloat(match)) : 15;

            const timer = setInterval(() => {
              if (waitSeconds <= 0) {
                clearInterval(timer);
                statusBar.textContent = "Ready to try again.";
                convertBtn.disabled = false;
                convertBtn.textContent = "⚡ Convert to LaTeX";
              } else {
                convertBtn.textContent = `Wait ${waitSeconds}s...`;
                statusBar.textContent = `Rate limit cooldown: ${waitSeconds}s remaining`;
                waitSeconds--;
              }
            }, 1000);
            return;
          }

          throw new Error(errMsg);
        }

        const data = await response.json();
        let rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
        rawText = rawText.replace(/```latex/gi, "").replace(/```/g, "").trim();

        if (rawText) {
          renderLatex(rawText);
          statusBar.textContent = "Conversion complete.";
        } else {
          statusBar.textContent = "No formula detected. Please redraw clearly.";
        }
      } catch (error) {
        statusBar.textContent = `Error: ${error.message}`;
      } finally {
        if (!convertBtn.textContent.includes("Wait")) {
          convertBtn.disabled = false;
          convertBtn.textContent = "⚡ Convert to LaTeX";
        }
      }
    }

    document.getElementById("convertBtn").addEventListener("click", convertToLatex);

    document.getElementById("copyBtn").addEventListener("click", async () => {
      const rawText = document.getElementById("rawLatex").value;
      if (!rawText) return;

      try {
        await navigator.clipboard.writeText(rawText);
        const copyBtn = document.getElementById("copyBtn");
        const originalText = copyBtn.textContent;
        copyBtn.textContent = "Copied!";
        setTimeout(() => {
          copyBtn.textContent = originalText;
        }, 1800);
      } catch (err) {
        document.getElementById("statusBar").textContent = "Clipboard access denied.";
      }
    });

    window.addEventListener("load", resizeCanvas);
    window.addEventListener("resize", resizeCanvas);
  </script>
</body>
</html>
